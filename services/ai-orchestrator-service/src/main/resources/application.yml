server:
  port: 8084

spring:
  application:
    name: ai-orchestrator-service
  main:
    # Both web (via common-security) and webflux (WebClient) are on the classpath — be a servlet app.
    web-application-type: servlet
  profiles:
    active: ${JARVIS_PROFILE:local}
  # Generous timeouts for the RestClient that Spring AI uses to call Ollama — local model
  # generation (esp. the first, cold call) can run well past the default read timeout.
  http:
    client:
      connect-timeout: 30s
      read-timeout: 5m

jarvis:
  ai:
    parser-model: ${JARVIS_PARSER_MODEL:qwen3.5:9b}
    agent-model: ${JARVIS_AGENT_MODEL:qwen3.5:27b}
    # How long Ollama keeps a model resident after a call — avoids reloading between chunks.
    keep-alive: ${JARVIS_KEEP_ALIVE:30m}
    # Statement scanning sends the WHOLE statement in one call, so the context must hold the full
    # text + prompt + the JSON it emits (Ollama's default num_ctx 2048 is far too small and drops
    # rows + the account header). qwen3.5:9b supports a 32k window.
    statement-num-ctx: ${JARVIS_STMT_NUM_CTX:32768}
    statement-num-predict: ${JARVIS_STMT_NUM_PREDICT:8192}
    # Allowed categories for the parser (kept in config so this service stays stateless).
    categories: Food, Shopping, Bills & Utilities, Transport, Entertainment, Health, Transfers, Loan EMI, Card Payment, Income, Uncategorized
  rag:
    # The corpus of regulator guidance the assistant can quote. Indexing is a separate, deliberate
    # run (see CorpusIndexer) -- normal startup must never re-embed 300 chunks.
    enabled: ${JARVIS_RAG_ENABLED:true}
    index-on-start: ${JARVIS_RAG_INDEX:false}
    corpus-dir: ${JARVIS_RAG_CORPUS:../../corpus}
    top-k: ${JARVIS_RAG_TOP_K:4}
    # Below this cosine score a hit is noise. Retrieval returning nothing is a good answer: it lets
    # the agent fall back to the user's own figures instead of quoting something irrelevant.
    # Calibrated against an off-corpus control ("how does a 401(k) work?") that scored 0.64 while
    # genuine hits scored 0.69-0.81. Provisional: re-tune once the full eval set exists.
    min-score: ${JARVIS_RAG_MIN_SCORE:0.66}
  security:
    jwt-secret: ${JARVIS_JWT_SECRET:dev-only-change-me-please-32-bytes-minimum!!}
    jwt-ttl-minutes: ${JARVIS_JWT_TTL_MINUTES:1440}
    public-paths: /internal/**
  internal:
    key: ${JARVIS_INTERNAL_KEY:dev-internal-key-change-me}
  expense:
    base-url: ${EXPENSE_BASE_URL:lb://expense-service}
  cors:
    allowed-origins: ${JARVIS_CORS_ORIGINS:http://localhost:5173}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.jarvis: DEBUG

---
# ===== local profile: Ollama (default, ₹0) =====
spring:
  config:
    activate:
      on-profile: local
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never   # we manage `ollama pull` ourselves
      chat:
        options:
          model: ${JARVIS_AGENT_MODEL:qwen3.5:27b}
          temperature: 0.1
      embedding:
        options:
          # 1024-dimension model. Changing this invalidates every stored vector -- same dimension
          # is not the same vector space -- so a switch means re-indexing the whole collection.
          model: ${JARVIS_EMBED_MODEL:bge-large}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}   # gRPC, not the 6333 HTTP/dashboard port
        collection-name: ${QDRANT_COLLECTION:jarvis_financial_guidance}
        # The collection is created by hand with keyword indexes on country/audience/source, which
        # this would not do for us.
        initialize-schema: false
