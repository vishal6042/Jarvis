      <stop offset="0" stop-color="#152F52"/><stop offset="0.5" stop-color="#0B1B33"/><stop offset="1" stop-color="#050C18"/>
    </linearGradient>
    <radialGradient id="jb-glow" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#2FC9F2" stop-opacity="0.26"/><stop offset="1" stop-color="#2FC9F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jb-shell" x1="0.15" y1="0" x2="0.85" y2="1">
