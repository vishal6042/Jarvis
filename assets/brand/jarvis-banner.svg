    <text x="364" y="398" font-size="19" font-weight="500" letter-spacing="7.4" fill="#A9BED6">YOUR FINANCIAL ASSISTANT</text>
    <text x="364" y="432" font-size="14" font-weight="500" letter-spacing="5" fill="#6E8BA8">PLAN<tspan fill="#34D98A"> · </tspan>SAVE<tspan fill="#34D98A"> · </tspan>INVEST<tspan fill="#34D98A"> · </tspan>GROW</text>
