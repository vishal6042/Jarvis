# Build everything Jarvis ships, test it, and publish a GitHub Release.
#
# Fires on a pushed `v*` tag. Every component is stamped with the tag's version, the whole test
# suite runs and is reported in JUnit XML (plus a readable HTML report), and the release is only
# published if nothing failed.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)build a release from"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "21"
  ANDROID_JAVA_VERSION: "17"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------- version
  meta:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      version_code: ${{ steps.v.outputs.version_code }}
      date: ${{ steps.v.outputs.date }}
      title: ${{ steps.v.outputs.title }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          # IST, not the runner's UTC: an evening tag in India would otherwise be titled with
          # yesterday's date.
          DATE="$(TZ=Asia/Kolkata date +%Y-%m-%d)"
          # Android needs a monotonic integer; the run number gives us one for free.
          VERSION_CODE="$(( 1000 + GITHUB_RUN_NUMBER ))"
          # Semver says a hyphen means pre-release - which is also what a throwaway test tag looks like.
          case "$VERSION" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "date=$DATE"
            echo "title=Jarvis-$DATE-$TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "### Jarvis-$DATE-$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Version \`$VERSION\` · Android versionCode \`$VERSION_CODE\` · prerelease \`$PRERELEASE\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- backend services
  services:
    name: Backend services (jars + tests)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Stamp the release version on every module
        working-directory: services
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="${{ needs.meta.outputs.version }}" \
            -DprocessAllModules=true -DgenerateBackupPoms=false

      # Failures are collected rather than thrown, so the report job sees the whole picture and
      # can be the single place that decides whether this release may be published.
      - name: Build and test all modules
        working-directory: services
        run: ./mvnw -B -ntp -Dmaven.test.failure.ignore=true verify

      - name: Collect the JUnit XML
        if: always()
        run: |
          mkdir -p test-xml/services
          # --parents keeps the module in the path, which is how the report names each suite.
          find services -type f -path "*/surefire-reports/*.xml" \
            -exec cp --parents {} test-xml/services/ \;
          find test-xml/services -name "*.xml" | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-xml-services
          path: test-xml/services
          if-no-files-found: error

      # One zip rather than nine loose jars: the stack only runs with all of them, zipping costs
      # nothing (fat jars are already compressed - 547MB becomes 488MB), and the launchers can
      # ride along so the archive is runnable as it stands.
      - name: Package the jars
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGE="stage/jarvis-services-$TAG"
          mkdir -p "$STAGE/jars" dist
          # Boot jars sit directly in target/; the pre-repackage copies are *.jar.original and
          # do not match this glob.
          find services -type f -name "*.jar" -path "*/target/*" ! -path "*/target/*/*" \
               ! -name "*-sources.jar" ! -name "*-javadoc.jar" | while read -r jar; do
            module="$(basename "$(dirname "$(dirname "$jar")")")"
            case "$module" in
              # The one module that is a library rather than a runnable service.
              common-security) out="jarvis-lib-common-security-$TAG.jar" ;;
              *)               out="jarvis-service-${module%-service}-$TAG.jar" ;;
            esac
            cp "$jar" "$STAGE/jars/$out"
          done
          cp services/services.json services/start-all.ps1 services/service-list.ps1 "$STAGE/"
          cp services/README.md "$STAGE/" 2>/dev/null || true
          echo "Jarvis $TAG - built from $GITHUB_SHA on ${{ needs.meta.outputs.date }}" > "$STAGE/VERSION.txt"
          ls -1 "$STAGE/jars"
          (cd stage && zip -qr "../dist/jarvis-services-$TAG.zip" "jarvis-services-$TAG")

      - uses: actions/upload-artifact@v4
        with:
          name: dist-services
          path: dist/*.zip
          if-no-files-found: error

  # --------------------------------------------------------------- web app
  web:
    name: Web app (static bundle)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build

      - name: Package
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p dist
          (cd frontend/dist && zip -qr "$GITHUB_WORKSPACE/dist/jarvis-web-$TAG.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/*.zip
          if-no-files-found: error

  # ------------------------------------------------- desktop control center
  desktop:
    name: Desktop Control Center (Windows installer)
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build the renderer and main process
        shell: bash
        working-directory: desktop
        run: |
          npm ci
          npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version
          npm run build

      - name: Pack the NSIS installer
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ""
        run: npx --no-install electron-builder --win --publish never

      - name: Name the installer after the release
        shell: bash
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p dist
          SETUP="$(find desktop/release -maxdepth 1 -name "*Setup*.exe" | head -1)"
          if [ -z "$SETUP" ]; then
            echo "electron-builder produced no installer:"; ls -la desktop/release; exit 1
          fi
          cp "$SETUP" "dist/jarvis-desktop-$TAG.exe"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop
          path: dist/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------ android app
  android:
    name: Android app (APK + tests)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.ANDROID_JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept the SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Same deal as the services: collect the failures, let the report job be the gate.
      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: android
        run: |
          chmod +x ./gradlew
          # `test` would run the same suite twice, once per build type.
          ./gradlew --no-daemon testDebugUnitTest

      - name: Collect the JUnit XML
        if: always()
        run: |
          mkdir -p test-xml/android
          find android -type f -path "*/test-results/*" -name "*.xml" \
            -exec cp --parents {} test-xml/android/ \;
          find test-xml/android -name "*.xml" | sed 's/^/  /'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-xml-android
          path: test-xml/android
          if-no-files-found: error

      # Unsigned release APKs cannot be installed, and this app is sideloaded by design - so the
      # debug key is what makes it installable unless a real keystore is configured in secrets.
      - name: Assemble the APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          ARGS="-PjarvisVersionName=${{ needs.meta.outputs.version }} -PjarvisVersionCode=${{ needs.meta.outputs.version_code }}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis.jks"
            ./gradlew --no-daemon assembleRelease $ARGS \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/jarvis.jks" \
              -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret - shipping the debug-signed APK."
            ./gradlew --no-daemon assembleDebug $ARGS
          fi

      - name: Name the APK after the release
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk -name "*.apk" ! -name "*unsigned*" | head -1)"
          if [ -z "$APK" ]; then
            echo "no installable APK was produced:"; find android/app/build/outputs -type f; exit 1
          fi
          cp "$APK" "dist/jarvis-android-$TAG.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*.apk
          if-no-files-found: error

  # ----------------------------------------------------------- test report
  report:
    name: Test report
    needs: [meta, services, android]
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: test-xml-*
          path: test-xml

      - name: Aggregate every JUnit XML
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p report/raw
          # Keep the untouched Surefire/Gradle XML alongside the merged one; that raw form is what
          # other tools ingest.
          cp -r test-xml/. report/raw/
          python3 .github/scripts/junit_report.py test-xml \
            --version "${{ needs.meta.outputs.version }}" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --html "report/jarvis-test-report-$TAG.html" \
            --markdown "report/test-summary.md" \
            --merged "report/raw/junit-merged.xml" \
            --fail-on-failure
        continue-on-error: true
        id: aggregate

      - name: Publish the summary to the job page
        if: always()
        run: cat report/test-summary.md >> "$GITHUB_STEP_SUMMARY" || echo "No test summary produced." >> "$GITHUB_STEP_SUMMARY"

      - name: Package the raw JUnit XML
        if: always()
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          mkdir -p dist report/raw
          cp "report/jarvis-test-report-$TAG.html" dist/ 2>/dev/null || true
          # If the aggregation itself fell over there is nothing to summarise; leave a placeholder
          # rather than failing here, so the gate step below is what reports the problem.
          if [ -f report/test-summary.md ]; then
            cp report/test-summary.md dist/
          else
            printf '## Test results\n\nNo JUnit XML reached the report job.\n' > dist/test-summary.md
          fi
          (cd report/raw && zip -qr "$GITHUB_WORKSPACE/dist/jarvis-test-reports-$TAG.zip" .)
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-tests
          path: dist/*
          if-no-files-found: error

      - name: Fail the release if anything failed
        if: steps.aggregate.outcome != 'success'
        run: |
          echo "::error::Tests failed - see the report above. No release will be published."
          exit 1

  # --------------------------------------------------------------- release
  release:
    name: Publish the release
    needs: [meta, services, web, desktop, android, report]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          fetch-depth: 0 # release_notes.py walks back to the previous tag

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: incoming

      - name: Gather the assets
        id: assets
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          # Deliberately not `assets/` - the repo already has one (the brand SVGs), and staging
          # into it both sweeps those into the release and breaks the checksum glob on its
          # subdirectory.
          OUT=release-assets
          mkdir -p "$OUT"
          find incoming -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.apk" -o -name "*.html" \) \
            -exec cp {} "$OUT/" \;
          # Hashed into RUNNER_TEMP first: redirecting into the directory being hashed would put
          # the half-written checksum file in its own glob.
          (cd "$OUT" && sha256sum $(ls) > "$RUNNER_TEMP/checksums.txt")
          mv "$RUNNER_TEMP/checksums.txt" "$OUT/jarvis-checksums-$TAG.txt"
          ls -la "$OUT"

          # A markdown table of what is attached, for the release body.
          {
            echo "## Downloads"
            echo
            echo "| File | What it is | Size |"
            echo "|---|---|--:|"
            for f in "$OUT"/*; do
              name="$(basename "$f")"
              size="$(du -h "$f" | cut -f1)"
              case "$name" in
                jarvis-services-*.zip)  what="All 9 Spring Boot service jars, plus \`services.json\` and the PowerShell launchers" ;;
                jarvis-web-*.zip)       what="The React PWA, built for production (static files)" ;;
                jarvis-desktop-*.exe)   what="Jarvis Control Center installer (Windows x64, NSIS)" ;;
                jarvis-android-*.apk)   what="Jarvis Sync for Android (sideload, API 26+)" ;;
                jarvis-test-report-*)   what="Readable test report for this build" ;;
                jarvis-test-reports-*)  what="Raw JUnit XML from Surefire and Gradle, plus a merged \`junit-merged.xml\`" ;;
                jarvis-checksums-*)     what="SHA-256 of every file above" ;;
                *)                      what="—" ;;
              esac
              echo "| \`$name\` | $what | $size |"
            done
            echo
          } > assets-table.md
          cp incoming/dist-tests/test-summary.md test-summary.md

      - name: Write the release notes
        run: |
          python3 .github/scripts/release_notes.py \
            --tag "${{ needs.meta.outputs.tag }}" \
            --version "${{ needs.meta.outputs.version }}" \
            --date "${{ needs.meta.outputs.date }}" \
            --repo "$GITHUB_REPOSITORY" \
            --tests-file test-summary.md \
            --assets-file assets-table.md \
            --out notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          TITLE="${{ needs.meta.outputs.title }}"
          # Written as an if, not `[ ... ] && FLAGS=...`: the step runs under `set -e`, where a
          # false test on the last line of a && chain would abort every non-prerelease tag.
          FLAGS=""
          if [ "${{ needs.meta.outputs.prerelease }}" = "true" ]; then
            FLAGS="--prerelease"
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md $FLAGS
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" --title "$TITLE" --notes-file notes.md $FLAGS release-assets/*
          fi
          echo "Published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
